name: Coliseum course examples

on:
  pull_request:
    paths:
      - 'courses/coliseum/**'
      - 'src/main/resources/topics/Колизей/**'
      - '.github/workflows/coliseum-course.yml'
  push:
    paths:
      - 'courses/coliseum/**'
      - 'src/main/resources/topics/Колизей/**'
      - '.github/workflows/coliseum-course.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python courses/coliseum/verify.py
