<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javapolis - Вход в систему</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo-container {
            margin-bottom: 1.5rem;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            color: white;
            font-size: 2rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #666;
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }

        .input-container {
            position: relative;
        }

        .input-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            font-size: 1.1rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .forgot-password {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
            margin: 0 0.5rem;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        #logout-link {
            color: #dc3545 !important;
        }

        #logout-link:hover {
            color: #c82333 !important;
        }

        .divider {
            margin: 25px 0;
            position: relative;
            text-align: center;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e1e5e9;
        }

        .divider span {
            background: rgba(255, 255, 255, 0.95);
            padding: 0 15px;
            color: #666;
            font-size: 0.9rem;
        }

        .social-login {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            color: #666;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-btn:hover {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-2px);
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 1px solid #fcc;
            font-size: 0.9rem;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 1px solid #c3e6cb;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
                margin: 10px;
            }

            .logo {
                font-size: 1.8rem;
            }

            .logo-icon {
                width: 70px;
                height: 70px;
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
            <div class="logo-icon">
                <i class="fas fa-city"></i>
            </div>
        </div>
        <h1 class="logo">Javapolis</h1>
        <p class="subtitle">Вход в систему</p>
        
        <div id="error-message" class="error-message"></div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="username">Email или имя пользователя</label>
                <div class="input-container">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" name="username" class="form-control" 
                           placeholder="Введите email или имя пользователя" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <div class="input-container">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" class="form-control" 
                           placeholder="Введите пароль" required>
                </div>
            </div>
            
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Войти
            </button>
        </form>
        
        <a href="#" class="forgot-password">Забыли пароль?</a>
        <a href="/register.html" class="forgot-password" id="register-link" style="margin-left: 20px;">Создать аккаунт</a>
        <div id="user-info" style="display: none; margin-top: 20px; text-align: center;">
            <span id="username-display" style="color: #667eea; font-weight: 600; margin-right: 15px;"></span>
            <a href="/dashboard.html" class="forgot-password" style="margin-right: 15px;">Панель управления</a>
            <a href="#" class="forgot-password" id="logout-link">Выйти</a>
        </div>
        
        <div class="divider">
            <span>или войдите через</span>
        </div>
        
        <div class="social-login">
            <button class="social-btn" onclick="socialLogin('google')">
                <i class="fab fa-google"></i>
            </button>
            <button class="social-btn" onclick="socialLogin('github')">
                <i class="fab fa-github"></i>
            </button>
            <button class="social-btn" onclick="socialLogin('facebook')">
                <i class="fab fa-facebook-f"></i>
            </button>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Показываем индикатор загрузки
            const btn = document.querySelector('.btn-login');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Вход...';
            btn.disabled = true;
            
            // Отправляем запрос к API
            fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                credentials: 'include',
                body: JSON.stringify({ username, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('Успешный вход!', 'success');
                    // Перенаправляем на dashboard после успешного входа
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1000);
                } else {
                    showMessage(data.message || 'Ошибка входа', 'error');
                }
            })
            .catch(error => {
                showMessage('Ошибка соединения с сервером', 'error');
            })
            .finally(() => {
                // Восстанавливаем кнопку
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        });
        
        function showMessage(message, type) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            if (type === 'success') {
                errorDiv.style.background = '#d4edda';
                errorDiv.style.color = '#155724';
                errorDiv.style.borderColor = '#c3e6cb';
            } else {
                errorDiv.style.background = '#fee';
                errorDiv.style.color = '#c33';
                errorDiv.style.borderColor = '#fcc';
            }
            
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        function socialLogin(provider) {
            // Пока заглушка для социального входа
            showMessage(`Вход через ${provider} пока не доступен`, 'error');
        }

        // Проверяем статус аутентификации при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            checkAuthStatus();
            
            // Анимация появления
            const container = document.querySelector('.login-container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                container.style.transition = 'all 0.5s ease';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);
        });
        
        function checkAuthStatus() {
            fetch('/api/auth/status', {
                credentials: 'include'
            })
            .then(response => response.json())
            .then(data => {
                if (data.authenticated) {
                    // Если пользователь уже авторизован, скрываем кнопку регистрации
                    const registerLink = document.getElementById('register-link');
                    if (registerLink) {
                        registerLink.style.display = 'none';
                    }
                    
                    // Показываем информацию о пользователе
                    const userInfo = document.getElementById('user-info');
                    const usernameDisplay = document.getElementById('username-display');
                    const logoutLink = document.getElementById('logout-link');
                    
                    if (userInfo && usernameDisplay && logoutLink) {
                        userInfo.style.display = 'block';
                        usernameDisplay.textContent = `Добро пожаловать, ${data.username || 'Пользователь'}!`;
                        logoutLink.onclick = function(e) {
                            e.preventDefault();
                            logout();
                        };
                    }
                    
                    // Также можно скрыть разделитель и социальные кнопки
                    const divider = document.querySelector('.divider');
                    const socialLogin = document.querySelector('.social-login');
                    if (divider) divider.style.display = 'none';
                    if (socialLogin) socialLogin.style.display = 'none';
                    
                    // Показываем сообщение о том, что пользователь уже авторизован
                    showMessage('Вы уже авторизованы!', 'success');
                }
            })
            .catch(error => {
                console.error('Ошибка проверки статуса:', error);
                // В случае ошибки оставляем страницу как есть
            });
        }
        
        function logout() {
            fetch('/api/auth/logout', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                credentials: 'include'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('Успешный выход!', 'success');
                    // Перезагружаем страницу для сброса состояния
                    setTimeout(() => {
                        window.location.reload();
                    }, 1000);
                }
            })
            .catch(error => {
                console.error('Ошибка выхода:', error);
                showMessage('Ошибка при выходе', 'error');
            });
        }
    </script>
</body>
</html>
